# yaml-language-server: $schema=./.vscode/schemas/pnpm-workspace.json
packages:
  - 'apps/*'
  - 'packages/*'
  - 'packages/config/*'

# pnpm 11 prompts before wiping stale node_modules; without a TTY (husky/IDE) that aborts.
# SchemaStore still omits this key; local schema above allows it.
confirmModulesPurge: false

allowBuilds:
  unrs-resolver: true

catalog:
  '@clack/prompts': ^1.7.0
  '@types/node': ^26.1.2
  commander: ^15.0.0
  eslint: ^10.8.0
  eslint-config-prettier: ^10.1.8
  oxfmt: ^0.62.0
  oxlint: ^1.77.0
  typescript: ^6.0.3

minimumReleaseAge: 1440 # 24 hours
minimumReleaseAgeExclude:
  - js-yaml@4.3.0
  - js-yaml@4.3.1
overrides:
  ajv@>=7.0.0-alpha.0 <8.18.0: '>=8.20.0'
  brace-expansion@>=2.0.0 <2.0.3: '>=5.0.9'
  brace-expansion@>=3.0.0 <5.0.9: '>=5.0.9'
  brace-expansion@>=5.0.0 <5.0.9: '>=5.0.9'
  fast-uri@<=3.1.0: '>=3.1.4'
  fast-uri@<=3.1.3: '>=3.1.4'
  flatted@<3.4.0: '>=3.4.0'
  flatted@<=3.4.1: '>=3.4.2'
  js-yaml@<3.14.2: '>=3.14.2'
  js-yaml@>=4.0.0 <4.3.0: 4.3.1
  minimatch@>=9.0.0 <9.0.6: '>=10.2.6'
  minimatch@>=9.0.0 <9.0.7: '>=10.2.6'
  picomatch@<2.3.2: '>=2.3.2'
  picomatch@>=4.0.0 <4.0.4: '>=4.0.5'
  turbo@<=2.9.13: '>=2.9.14'
  turbo@>=1.1.0 <2.9.14: '>=2.10.8'
